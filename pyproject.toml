[tool.poetry]
name = "oceanstream"
version = "1.0.0rc1"
description = "Process ship, USV and mooring data into GeoParquet, Zarr and STAC: tracks and sensors, echosounders, multibeam and ADCP."
authors = ["Andrei Neacsu <andrei@oceanstream.io>"]
license = "MIT"
readme = "oceanstream/README.md"
homepage = "https://oceanstream.io"
repository = "https://github.com/OceanStreamIO/oceanstream-cli"
documentation = "https://github.com/OceanStreamIO/oceanstream-cli/tree/main/docs"
keywords = ["oceanography", "geoparquet", "stac", "saildrone", "geospatial", "usv", "marine-data", "echosounder", "multibeam", "adcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Oceanography",
]

# Explicitly include only the oceanstream package
packages = [{ include = "oceanstream" }]

# Exclude non-essential files from the package
exclude = [
    "oceanstream/tests/",
    "oceanstream/docs/",
    "oceanstream/MANIFEST.in",
    "oceanstream/**/*.prompt.md",
    "oceanstream/pyproject.toml",
    "oceanstream/**/*.bak*",
    "oceanstream/**/__pycache__/",
    "oceanstream/**/.pytest_cache/",
    # Root-level files/folders that shouldn't be included
    "docs/",
    "docs-internal/",
    ".docs-website/",
    "notebooks/",
    "examples/",
    "scripts/",
    "raw_data/",
    "data/",
    "htmlcov/",
    "_oceanstream-website-static/",
    ".mkdocs-shadcn-fork/",
    "*.md",
    "Makefile",
    "*.toml.example",
    "test_*.py",
    "demo_*.py",
    "analyze_*.py",
]

[tool.poetry.urls]
"Issues" = "https://github.com/OceanStreamIO/oceanstream-cli/issues"

[tool.poetry.scripts]
oceanstream = "oceanstream.cli:app"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
# Core dependencies (always installed)
pandas = ">=2.1"
pydantic = ">=2,<3"
pyarrow = ">=14"
azure-storage-blob = ">=12.19"
typer = ">=0.12"
rich = ">=13.7"
tqdm = ">=4.66"
python-dotenv = ">=1.0"  # config/settings.py loads .env on import
# Track and sensor processing (`process geotrack`): GeoParquet, NMEA logs, SeaBird CTD files
geopandas = ">=0.14"
shapely = ">=2.0"
pynmea2 = ">=1.18"
# 2.7.9 and later pin numpy~=2.0.2 and scipy~=1.13.1, which have no Python 3.13 wheels and
# clash with the echodata numpy pins; 3.x returns xarray Datasets from read_hex_file, which
# sbe911.py reads as DataFrames.
seabirdscientific = ">=2.7,<2.7.9"

# Optional dependencies for specific processing modules

# Echodata dependencies (pinned for echopype compatibility)
# OceanStreamIO's echopype fork (branch oceanstream-integration), published on PyPI under its
# own name. It installs the `echopype` import package, so it replaces upstream echopype.
oceanstream-echopype = { version = "==0.11.1a3", optional = true }
# NumPy 2.1 is the first release with CPython 3.13 wheels.
numpy = [
    { version = ">=1.26.4,<2.1", python = "<3.13", optional = true },
    { version = ">=2.1,<2.3", python = ">=3.13", optional = true },
]
# Below 2026.9: that release rejects the legacy "compressor" encoding for Zarr
# format 3, which echopype's EchoData.to_zarr still sets, so raw conversion fails.
xarray = { version = ">=2024.11.0,<2026.9", optional = true }
dask = { version = ">=2024.9.0", extras = ["complete"], optional = true }
distributed = { version = ">=2024.9.0", optional = true }
zarr = { version = ">=2.16", optional = true }
netcdf4 = { version = ">=1.6", optional = true }
fsspec = { version = "2025.3.2", optional = true }
# Pinned to the fsspec release train — s3fs requires an exact fsspec match.
s3fs = { version = "2025.3.2", optional = true }
numcodecs = { version = "0.14.1", optional = true }
bottleneck = { version = "1.5.0", optional = true }
openpyxl = { version = ">=3.0", optional = true }
adlfs = { version = ">=2024.4.0", optional = true }

# ADCP processing (dolfyn for RDI binary files)
dolfyn = { version = ">=1.3", optional = true }
scipy = { version = ">=1.12", optional = true }
setuptools = { version = "<81", optional = true }  # dolfyn needs pkg_resources

# Environmental data fallback (Copernicus Marine Service)
copernicusmarine = { version = ">=1.0.0", optional = true }
gsw = { version = ">=3.6.0", optional = true }

# Visualization (optional for echodata)
matplotlib = { version = ">=3.7", optional = true }
hvplot = { version = ">=0.9", optional = true }
datashader = { version = ">=0.16", optional = true }
holoviews = { version = ">=1.18", optional = true }
panel = { version = ">=1.3", optional = true }
bokeh = { version = ">=3.3", optional = true }

# Dask image processing (for advanced denoise kernels)
dask-image = { version = ">=2023.8", optional = true }

# GPS / location processing
haversine = { version = ">=2.8", optional = true }

# ERDDAP / OPeNDAP data access (for NorSOOP FerryBox, EMSO, EMODnet)
erddapy = { version = ">=2.0", optional = true }

# Multibeam: themachinethatgoesping reads Kongsberg .all/.wcd, .kmall, .s7k and GSF.
# Pinned: its API is still 0.x. Its own dependencies include PySide6 for its viewers;
# EDITO jobs install it with --no-deps to leave them out (see docs/multibeam.md).
themachinethatgoesping = { version = "0.37.1", python = ">=3.12", optional = true }
# Writes the web map tiles of the multibeam grids (`process multibeam --tiles`).
pmtiles = { version = ">=3.4", optional = true }

# Raster IO and projections: multibeam grids and geotrack heatmaps.
rasterio = { version = ">=1.3", optional = true }
pyproj = { version = ">=3.6", optional = true }
# HTTP downloads: seabed bathymetry lookups and the raw-data mirrors in oceanstream/sources.
requests = { version = ">=2.31", optional = true }

[tool.poetry.extras]
# Processing module extras. Track and sensor processing (`process geotrack`) needs none:
# its dependencies are core.

# NorSOOP/FerryBox data access (THREDDS/ERDDAP)
norsoop = ["erddapy"]

# Echodata processing (EK60/EK80 echosounders)
echodata = [
    "oceanstream-echopype", "numpy", "xarray", "dask", "distributed", "zarr", "netcdf4",
    "fsspec", "s3fs", "numcodecs", "bottleneck", "openpyxl",
    "copernicusmarine", "gsw", "adlfs", "haversine"
]
echodata-viz = ["matplotlib", "hvplot", "datashader", "holoviews", "panel", "bokeh"]

multibeam = ["themachinethatgoesping", "numpy", "scipy", "rasterio", "pyproj", "matplotlib", "pmtiles"]
adcp = ["dolfyn", "scipy", "setuptools", "xarray"]

# Convenience extras
all = [
    "oceanstream-echopype", "numpy", "xarray", "dask", "distributed", "zarr", "netcdf4",
    "fsspec", "s3fs", "numcodecs", "bottleneck", "openpyxl", "adlfs",
    "copernicusmarine", "gsw", "matplotlib", "hvplot", "datashader",
    "holoviews", "panel", "bokeh", "haversine", "erddapy",
    "dolfyn", "scipy", "setuptools",
    "rasterio", "pyproj", "requests",
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
ruff = ">=0.6"
mypy = ">=1.10"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
