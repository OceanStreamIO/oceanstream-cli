name: Docker images

# Builds and publishes the images to GHCR on every push to main that touches them,
# and from a manual run (to rebuild a commit). Tags: sha-<full sha> and sha-<short sha>,
# e.g. ghcr.io/oceanstreamio/oceanstream-cli/echodata:sha-abc1234. Nothing deploys by
# itself: the manifests pin an exact tag.
on:
  push:
    branches: [main]
    paths:
      - oceanstream/**
      - scripts/batch_processing/**
      - pyproject.toml
      - requirements-hpc.txt
      - docker/Dockerfile.echodata
      - docker/Dockerfile.hpc-submitter
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Base of the Denoise Lab worker: oceanstream[echodata] and the batch scripts.
          - image: echodata
            dockerfile: docker/Dockerfile.echodata
          # Prefect worker that drives the cluster over SSH (oceanstream.hpc.flows).
          - image: hpc-submitter
            dockerfile: docker/Dockerfile.hpc-submitter
    steps:
      - uses: actions/checkout@v4
      - id: image
        shell: bash
        run: |
          echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          tags: |
            ghcr.io/${{ steps.image.outputs.repository }}/${{ matrix.image }}:sha-${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.repository }}/${{ matrix.image }}:sha-${{ steps.image.outputs.short }}
