name: Bug report
description: File a bug report
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and steps to reproduce.
      placeholder: Tell us what you saw.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `oceanstream --version` and Python version.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste relevant logs or stack traces.
      render: shell
