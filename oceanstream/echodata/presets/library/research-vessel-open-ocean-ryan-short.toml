# research-vessel-open-ocean-ryan-tn with a short comparison block for Ryan's detector.

[preset]
key = "research-vessel-open-ocean-ryan-short"
name = "Research vessel, open ocean, Ryan detector, short block"
status = "draft"
summary = "research-vessel-open-ocean-ryan-tn comparing each ping with the 8 pings either side."
description = """
With n_pings 20-50 either side, Ryan's detector compares an RR2205 ping with the median over 26 to 66 minutes, since each channel pings about every 39 s. A layer moving into a depth bin during that time lifts the bin's 15th percentile above the block median, and the bin is flagged although it holds biology. Eight pings either side, about 5 minutes, lets the median follow a migrating layer while a single raised ping still stands out against 16 neighbours.
"""
derived_from = "research-vessel-open-ocean-ryan-tn"

[preset.applies_to]
platforms = ["research-vessel"]
regimes = ["open-ocean", "slope"]
water_depth_m = [1000.0, 6000.0]
pulse_mode = "CW"
echosounders = ["Simrad EK80 WBT"]

[[preset.validations]]
cruise = "RR2205"
days = ["2022-06-21", "2022-06-30", "2022-07-02", "2022-07-07", "2022-07-12"]
outcome = "pending"
notes = "Round 5 (2026-10-18), with --background-estimator quantile, seabed mask and no cross-talk pruning, four deep-water days: deepest 30 % of range still kept 2.0 % at 38 kHz and 4.9 % at 18 kHz (draft 5.4 % and 11.4 %); streak pings 1.1 % and 4.4 % (draft 8.0 % and 19.3 %). Leaves the layers migrating at dawn and dusk intact, which -ryan-tn does not. Transient flags 4.0 % of 38 kHz and 15.4 % of 18 kHz cells."
reference = "s3://noaa-wcsd-pds/data/raw/Roger_Revelle/RR2205/EK80/"

[echodata.denoise]
methods = ["impulse", "attenuation", "transient", "background"]
use_frequency_specific = true

[echodata.denoise.frequency_params.18000]
impulse     = { vertical_bin_size = "6m", ping_lags = [1, 2], threshold_db = 10.0 }
attenuation = { upper_limit_sl = 250.0, lower_limit_sl = 500.0, num_side_pings = 15, threshold = 6.0 }
transient   = { exclude_above = 300.0, depth_bin = 15.0, n_pings = 8, thr_dB = 6.0, maxts = -35.0, detector = "ryan", percentile = 15.0 }
background  = { range_window = 35, ping_window = 60, SNR_threshold = "3.0dB", background_noise_max = "-130.0dB" }

[echodata.denoise.frequency_params.38000]
impulse     = { vertical_bin_size = "5m", ping_lags = [1, 2], threshold_db = 12.0 }
attenuation = { upper_limit_sl = 400.0, lower_limit_sl = 500.0, num_side_pings = 100, threshold = 10.0 }
transient   = { exclude_above = 200.0, depth_bin = 20.0, n_pings = 8, thr_dB = 6.0, maxts = -35.0, detector = "ryan", percentile = 15.0 }
background  = { range_window = 30, ping_window = 50, SNR_threshold = "5.0dB", background_noise_max = "-125.0dB" }

[echodata.denoise.frequency_params.70000]
impulse     = { vertical_bin_size = "4m", ping_lags = [1, 2], threshold_db = 10.0 }
attenuation = { upper_limit_sl = 150.0, lower_limit_sl = 300.0, num_side_pings = 15, threshold = 5.0 }
transient   = { exclude_above = 200.0, depth_bin = 8.0, n_pings = 8, thr_dB = 6.0, maxts = -35.0, detector = "ryan", percentile = 15.0 }
background  = { range_window = 25, ping_window = 50, SNR_threshold = "3.0dB", background_noise_max = "-120.0dB" }

[echodata.denoise.frequency_params.120000]
impulse     = { vertical_bin_size = "3m", ping_lags = [1, 2], threshold_db = 9.0 }
attenuation = { upper_limit_sl = 150.0, lower_limit_sl = 250.0, num_side_pings = 80, threshold = 7.0 }
transient   = { exclude_above = 150.0, depth_bin = 15.0, n_pings = 8, thr_dB = 6.0, maxts = -35.0, detector = "ryan", percentile = 15.0 }
background  = { range_window = 20, ping_window = 50, SNR_threshold = "6.0dB", background_noise_max = "-115.0dB" }

[echodata.denoise.frequency_params.200000]
impulse     = { vertical_bin_size = "2m", ping_lags = [1], threshold_db = 8.0 }
attenuation = { upper_limit_sl = 50.0, lower_limit_sl = 150.0, num_side_pings = 60, threshold = 6.0 }
transient   = { exclude_above = 100.0, depth_bin = 10.0, n_pings = 8, thr_dB = 6.0, maxts = -35.0, detector = "ryan", percentile = 15.0 }
background  = { range_window = 15, ping_window = 40, SNR_threshold = "6.0dB", background_noise_max = "-110.0dB" }
