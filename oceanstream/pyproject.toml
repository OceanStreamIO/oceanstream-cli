[tool.poetry]
name = "oceanstream"
version = "0.1.0"
description = "Process oceanographic measurements from USVs and write partitioned GeoParquet datasets with geospatial metadata."
authors = ["Oceanstream <dev@oceanstream.local>"]
license = "MIT"
readme = "README.md"

[tool.poetry.scripts]
oceanstream = "oceanstream.cli:app"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
# Core dependencies (always installed)
pandas = ">=2.1"
pyarrow = ">=14"
azure-storage-blob = ">=12.19"
typer = ">=0.12"
rich = ">=13.7"
tqdm = ">=4.66"

# Optional dependencies for specific processing modules
geopandas = { version = ">=0.14", optional = true }
shapely = { version = ">=2.0", optional = true }
echopype = { version = ">=0.8", optional = true }
xarray = { version = ">=2023.1", optional = true }
zarr = { version = ">=2.16", optional = true }
netcdf4 = { version = ">=1.6", optional = true }

[tool.poetry.extras]
# Processing module extras
geotrack = ["geopandas", "shapely"]
echodata = ["echopype", "xarray", "zarr", "netcdf4"]
multibeam = []  # Future: MB-System Python bindings when available
adcp = []  # Future: ADCP processing libraries

# Convenience extras
all = ["geopandas", "shapely", "echopype", "xarray", "zarr", "netcdf4"]
geo = ["geopandas", "shapely"]  # Legacy alias for geotrack

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
ruff = ">=0.6"
mypy = ">=1.10"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"