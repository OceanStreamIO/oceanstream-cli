# Mirror a campaign's raw files into the project bucket on EDITO:
# `oceanstream campaign mirror` in a Job, so a long copy does not tie up the workspace pod.
#
#   ID=FKt260112; DIR=~/work/hpc-runs/$ID; KEY=code/oceanstream-cli-$(git rev-parse --short HEAD).tar.gz
#   git archive --format=tar.gz HEAD | aws s3 cp - s3://oceanstream-bucket/$KEY
#   kubectl create configmap campaign-$(echo $ID | tr A-Z_ a-z-) --from-file=$DIR/campaign.json \
#       --from-file=$DIR/hpc-run.toml --dry-run=client -o yaml | kubectl apply -f -
#   sed -e "s|@ID@|$ID|g" -e "s|@NAME@|$(echo $ID | tr A-Z_ a-z-)|g" -e "s|@CODE@|$KEY|g" \
#       -e "s|@FROM@|<tarball URL, zenodo:<record> or azure>|" deploy/edito/mirror/job.yaml | kubectl apply -f -
#
# Network-bound: a standard node, no GPU. Rerunning skips files already copied.
apiVersion: batch/v1
kind: Job
metadata:
  name: mirror-@NAME@
  labels: {app: campaign-mirror}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 172800
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {app: campaign-mirror}
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      imagePullSecrets: [{name: acr-pull-secret}]
      containers:
        - name: mirror
          image: oceanstreamdevacr.azurecr.io/denoise-lab-worker:5d99f65
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              python -c "import os, boto3; boto3.client('s3', endpoint_url=os.environ['AWS_ENDPOINT_URL']).download_file(os.environ['OCEANSTREAM_S3_BUCKET'], '@CODE@', '/work/src.tar.gz')"
              mkdir -p /work/src /work/campaigns/@ID@ && tar -xzf /work/src.tar.gz -C /work/src
              cp /campaign/* /work/campaigns/@ID@/
              cd /work/src && exec python -u -m oceanstream campaign mirror @ID@ \
                  --campaigns-dir /work/campaigns --from "@FROM@" --workers 8
          env:
            - {name: OCEANSTREAM_NO_MCP_PROMPT, value: "1"}
            - {name: HOME, value: /work}
            - {name: TMPDIR, value: /work}   # zips are spooled before unpacking
          envFrom:
            - secretRef: {name: oceanstream-s3}
          resources:
            requests: {cpu: "2", memory: 3Gi}
            limits: {cpu: "4", memory: 6Gi}
          volumeMounts:
            - {name: campaign, mountPath: /campaign}
            - {name: work, mountPath: /work}
      volumes:
        - name: campaign
          configMap: {name: campaign-@NAME@}
        - name: work
          emptyDir: {sizeLimit: 20Gi}
