# EDITO test of a catalogue campaign before its MareNostrum 5 run (docs/hpc-campaigns.md):
# Sv for the test days, then denoising with the campaign's preset (with NASC), then the
# echogram report, all into s3://$OCEANSTREAM_S3_BUCKET/edito-tests/<ID>/.
#
# Each campaign directory keeps its filled-in copy as edito-job.yaml. Placeholders:
#   @NAME@ (DNS-safe id), @ID@, @DAYS@, @CODE@ (code tarball key), @PRESET@,
#   @SV_ENV@ (extra env lines for the Sv run: SHIP, INSTRUMENT, RAW_S3_PREFIX, NAV_S3_KEY,
#   ENCODE_MODE, WAVEFORM_MODE), @SV_ARGS@ (Sv pipeline flags), @DENOISE_ARGS@, @MEM@.
#
#   kubectl create configmap ncei-sv-scripts --from-file=deploy/edito/ncei-sv/ \
#       --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -f ~/work/hpc-runs/<ID>/edito-job.yaml
#
# CPU only, on a large-memory GPU node without a GPU request (no GPU quota used).
apiVersion: batch/v1
kind: Job
metadata:
  name: edito-test-@NAME@
  labels: {app: edito-test, campaign: "@NAME@"}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 43200
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {app: edito-test, campaign: "@NAME@"}
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      imagePullSecrets: [{name: acr-pull-secret}]
      tolerations:
        - {key: node.cloudferro.com/type, operator: Equal, value: gpu, effect: NoSchedule}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: nvidia.com/gpu.product, operator: Exists}
      containers:
        - name: test
          image: oceanstreamdevacr.azurecr.io/denoise-lab-worker:5d99f65
          command: ["bash", "-c"]
          args:
            - |
              set -u
              MODE=sv PIPELINE_ARGS="$SV_ARGS" /scripts/run.sh || exit 1
              MODE=denoise WITH_NASC=1 PIPELINE_ARGS="$DENOISE_ARGS" /scripts/run.sh || exit 1
              MODE=report REPORT_RUNS="denoised=denoised-$PRESET" REPORT_MVBS="denoised-$PRESET" \
                  /scripts/run.sh
          envFrom:
            - secretRef: {name: oceanstream-s3}
          env:
            - {name: CRUISE, value: "@ID@"}
            - {name: DAYS, value: "@DAYS@"}
            - {name: S3_PREFIX, value: "edito-tests/@ID@"}
            - {name: CODE_S3_KEY, value: "@CODE@"}
            - {name: PRESET, value: "@PRESET@"}
            - {name: SV_ARGS, value: "@SV_ARGS@"}
            - {name: DENOISE_ARGS, value: "@DENOISE_ARGS@"}
            - {name: INSTALL_CUPY, value: "0"}
            - {name: REQUIRE_GPU, value: "0"}
            - {name: SV_RANGE_BIN_M, value: "0.18"}
            - {name: DASK_WORKERS, value: "2"}
            - {name: DASK_MEMORY, value: "@DASK_MEM@"}
            - {name: HOME, value: /work}
@SV_ENV@
          resources:
            requests: {cpu: "6", memory: @MEM@, ephemeral-storage: 40Gi}
            limits: {cpu: "12", memory: @MEM@, ephemeral-storage: 120Gi}
          volumeMounts:
            - {name: scripts, mountPath: /scripts}
            - {name: work, mountPath: /work}
      volumes:
        - name: scripts
          configMap: {name: ncei-sv-scripts, defaultMode: 0755}
        - name: work
          emptyDir: {}
